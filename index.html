    return strip(
      '<defs>' + lg(mar, [[0, '#FFFFFF'], [0.5, '#FDFBF5'], [1, '#DCD2C0']], 0, 0, 1, 0) + '</defs>' +
      '<g class="a-shimmer" style="animation-duration:5s">' + thrones + '</g>' +
      cols + pots + hearth);
  },

  /* --- L3 · a polished marble causeway --------------------------------- */
  L3: () => planeSVG({
    far: '#D8CEEE', near: '#C6BAE2', nearest: '#B0A2D2',
    pathFar: '#FFFDF6', pathNear: '#EDE4F6',
    rung: '#E3B23C', lane: '#7B5FC4', edge: '#9E8ECA',
  }),

  /* --- L4 · braziers, gold rails, cloud tearing past the lens ---------- */
  L4: () => {
    let g = '', shreds = '';
    // cloud shreds streaming past
    for (let i = 0; i < 7; i++) {
      const x = i * 240, y = 700 + (i % 3) * 70;
      if (x > 600 && x < 1000) continue;          // keep the hero's lane clear
      shreds += '<g opacity=".55">' +
        '<ellipse cx="' + x + '" cy="' + y + '" rx="170" ry="34" fill="#FFFFFF"/>' +
        '<ellipse cx="' + (x + 90) + '" cy="' + (y + 22) + '" rx="120" ry="26" fill="#F5EFFF"/></g>';
    }
    // gold rail along the causeway edge
    g += '<g stroke="#E3B23C" stroke-width="7" fill="none" opacity=".9">' +
      '<path d="M0 838 h1600"/></g>';
    for (let i = 0; i < 12; i++) {
      g += '<rect x="' + (i * 140) + '" y="838" width="10" height="62" rx="4" fill="#C9922E"/>';
    }
    // braziers at the very front
    [[150, 900], [900, 900], [1500, 900]].forEach((b, i) => {
      g += '<g transform="translate(' + b[0] + ' ' + b[1] + ')">' +
        '<path d="M-30 0 l8 -80 h44 l8 80Z" fill="#E3B23C"/>' +
        '<ellipse cx="0" cy="-80" rx="32" ry="9" fill="#C9922E"/>' +
        '<g class="a-flicker"' + dly(i * 3) + '>' +
          '<path d="M-20 -84 q10 -72 22 -90 q-6 44 8 54 q6 -46 14 -60 q12 68 -12 96Z" fill="#FFD98A"/>' +
          '<path d="M-8 -84 q6 -44 12 -56 q0 28 8 32 q0 -24 6 -32 q6 40 -8 56Z" fill="#FFFBE8"/></g></g>';
    });
    return strip('<g class="a-windSlow">' + shreds + '</g>' + g);
  },
};

   ======================================================================== */
/* ===========================================================================
   select.js — choose your hero
   ---------------------------------------------------------------------------
   Presented in the SAME five-lane plus as every junction, so the mechanic is
   taught before it is ever tested. Swipe, arrow keys, WASD and direct click
   all work here exactly as they will for the rest of the game.

   Which hero you pick changes nothing about your result. It is pure flavour,
   and the game never says so.
   =========================================================================== */

const Select = (function () {

  let cards = {};
  let focused = 'percy';
  let typeTimer = 0;

  function heroByDir(dir) {
    return HERO_KEYS.map((k) => HEROES[k]).find((h) => h.lane === dir);
  }

  /* the flavour line types itself out, one character at a time */
  function typeFlavour(text) {
    clearInterval(typeTimer);
    const el = D.flavour;
    if (G.reduced) { el.innerHTML = '&ldquo;' + text + '&rdquo;'; return; }
    let i = 0;
    el.innerHTML = '<span class="caret"></span>';
    typeTimer = setInterval(() => {
      i++;
      el.innerHTML = '&ldquo;' + text.slice(0, i) + '&rdquo;<span class="caret"></span>';
      if (i >= text.length) {
        clearInterval(typeTimer);
        setTimeout(() => { el.innerHTML = '&ldquo;' + text + '&rdquo;'; }, 900);
      }
    }, 26);
  }

  function focus(dir) {
    const h = heroByDir(dir);
    if (!h || focused === h.key) return;
    focused = h.key;
    for (const d in cards) cards[d].classList.toggle('target', d === dir);
    typeFlavour(h.flavourLine);
    D.live.textContent = h.name + '. ' + h.flavourLine;
  }

  function commit(dir) {
    const h = heroByDir(dir) || HEROES.percy;
    G.hero = h.key;
    Input.disarm();
    const el = cards[dir];
    if (el) {
      el.classList.add('chosen');
      const r = el.getBoundingClientRect();
      Particles.burst(r.left + r.width / 2, r.top + r.height / 2, h.accentHud, 34, 1.6);
    }
    for (const d in cards) if (d !== dir) { cards[d].classList.add('shatter'); }
    Audio2.divine();
    document.documentElement.style.setProperty('--hero-accent', h.accentHud);
    setTimeout(() => setState(S.REALM_INTRO), G.reduced ? 150 : 620);
  }

  function build() {
    let lanes = '';
    HERO_KEYS.forEach((k) => {
      const h = HEROES[k];
      lanes +=
        '<button type="button" class="lane lane-' + h.lane + '" data-dir="' + h.lane + '" ' +
          'style="--lane-glow:' + h.accentHud + '" aria-label="' + h.name + '">' +
          '<span class="glow"></span>' +
          '<span class="chev" aria-hidden="true">' + Glyph.chevron(h.lane) + '</span>' +
          '<span class="pedestal"></span>' +
          '<span class="sel-fig">' + Rig.still(k) + '</span>' +
          '<span class="lbl">' + h.name.split(' ')[0] + '</span>' +
        '</button>';
    });

    D.select.innerHTML =
      '<div class="screen-center"><div class="sel-wrap">' +
        '<h2 class="display">Who walks the road?</h2>' +
        '<p class="hint">Swipe, use the arrow keys, or just tap one.</p>' +
        '<div id="selLanes">' + lanes + '</div>' +
        '<p id="flavour"></p>' +
      '</div></div>';

    const grid = D.select.querySelector('#selLanes');
    grid.id = 'selLanes';
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(3, var(--card))';
    grid.style.gridTemplateRows = 'repeat(3, var(--card))';
    grid.style.gap = 'var(--gap)';

    D.flavour = D.select.querySelector('#flavour');
    cards = {};
    grid.querySelectorAll('.lane').forEach((el) => {
      cards[el.dataset.dir] = el;
      el.classList.add('bloomed');
      el.style.opacity = 1;
      el.style.transform = 'scale(1)';
      el.addEventListener('pointerenter', () => focus(el.dataset.dir));
      el.addEventListener('focus', () => focus(el.dataset.dir));
    });
  }

  return {
    handleCommit: commit,
    handleDrag(dir) {
      if (!dir) { for (const d in cards) cards[d].classList.remove('target', 'dimmed'); return; }
      focus(dir);
      for (const d in cards) cards[d].classList.toggle('dimmed', d !== dir);
    },

    init() {
      onEnter(S.CHARACTER_SELECT, () => {
        build();
        D.select.classList.add('on');
        D.hud.classList.add('dim');
        focused = null;
        focus('CENTRE');
        Input.preArm();
        Input.arm();
        const first = D.select.querySelector('.lane-CENTRE');
        if (first) first.focus({ preventScroll: true });
      });
      onExit(S.CHARACTER_SELECT, () => {
        clearInterval(typeTimer);
        D.select.classList.remove('on');
        Input.disarm();
      });
    },
  };
})();


/* ========================================================================
   src/screens/junction.js
   ======================================================================== */
/* ===========================================================================
   junction.js — the five-lane junction, and the choreography around it
   ---------------------------------------------------------------------------
   SPEC §A.1, in order:
     1. run ramps down, vignette closes, background pushes back
     2. ambient ducks, a lyre swell rises
     3. the question plaque slides down and settles with a bounce
     4. five cards stagger-bloom outward from centre, 70ms apart
     5. every card carries animated art — never a bare word
     6. on commit the chosen card flares white-hot and the other four
        shatter into light motes and drift away
   =========================================================================== */

const Junction = (function () {

  let currentQ = null;
  let cards = {};
  let onDone = null;
  let tiltRaf = 0;

  /* The glow colour of a lane is taken from the god it feeds most. That way
     the light on the card is a genuine hint, not decoration. */
  function laneGlow(opt) {
    let best = null, bestN = -1;
    for (const k in (opt.gods || {})) {
      if (opt.gods[k] > bestN) { bestN = opt.gods[k]; best = k; }
    }
    return best && GODS[best] ? GODS[best].colours[0] : '#FFE0A0';
  }

  function build(q) {
    const lanes = D.lanes;
    lanes.innerHTML = '';
    cards = {};
    q.options.forEach((opt) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'lane lane-' + opt.dir + (q.visualOnly ? ' visual' : '');
      el.dataset.dir = opt.dir;
      el.style.setProperty('--lane-glow', laneGlow(opt));
      // described by direction and, when there is one, its label — so a
      // screen reader user gets the same information as a sighted one
      el.setAttribute('aria-label',
        opt.dir.toLowerCase() + (q.visualOnly ? '' : ': ' + opt.label));
      el.innerHTML =
        '<span class="glow"></span>' +
        '<span class="chev" aria-hidden="true">' + Glyph.chevron(opt.dir) + '</span>' +
        '<span class="art">' + optionArt(opt.art) + '</span>' +
        (q.visualOnly ? '' : '<span class="lbl">' + opt.label + '</span>');
      lanes.appendChild(el);
      cards[opt.dir] = el;
    });
  }

  /* live drag: the whole group tilts toward the drag, the target lifts and
     brightens, the other four dim. The choice has to feel physical. */
  function onDrag(dir, strength, dx, dy) {
    if (G.reduced) return;
    for (const d in cards) {
      cards[d].classList.toggle('target', d === dir);
      cards[d].classList.toggle('dimmed', !!dir && d !== dir);
    }
    const k = Math.min(1, strength) * 7;
    const tx = dx ? Math.max(-1, Math.min(1, dx / 90)) : 0;
    const ty = dy ? Math.max(-1, Math.min(1, dy / 90)) : 0;
    D.lanes.style.transform =
      'perspective(900px) rotateY(' + (tx * k * 0.9) + 'deg) rotateX(' + (-ty * k * 0.9) + 'deg) ' +
      'translate3d(' + (tx * 9) + 'px,' + (ty * 9) + 'px,0)';
  }

  function resetTilt() {
    D.lanes.style.transform = '';
    for (const d in cards) cards[d].classList.remove('target', 'dimmed');
  }

  /* ---- the commit ------------------------------------------------------ */

  function commit(dir) {
    const opt = currentQ.options.find((o) => o.dir === dir) || currentQ.options[0];
    Input.disarm();
    resetTilt();

    // record the answer, and let it start changing the world
    G.answers.push({ q: currentQ, opt });
    pushTintFromOption(opt);

    // the chosen card flares white-hot; the other four shatter into motes
    for (const d in cards) {
      const el = cards[d];
      if (d === dir) {
        el.classList.add('chosen');
        const r = el.getBoundingClientRect();
        Particles.burst(r.left + r.width / 2, r.top + r.height / 2, laneGlow(opt), 30, 1.5);
      } else {
        const r = el.getBoundingClientRect();
        el.style.setProperty('--shatter-x', ((r.left + r.width / 2) - window.innerWidth / 2) * 0.22 + 'px');
        el.style.setProperty('--shatter-y', ((r.top + r.height / 2) - window.innerHeight / 2) * 0.22 - 30 + 'px');
        el.style.setProperty('--shatter-rot', ((Math.random() * 24) - 12).toFixed(1) + 'deg');
        el.classList.add('shatter');
        Particles.shatter(r, '#FFE9AE');
      }
    }

    Audio2.whoosh();
    Audio2.junctionEnd();

    // the hero turns into the choice before the camera whips round
    Rig.setState(Rig.poseForDirection(dir));

    const wait = G.reduced ? 160 : 560;
    setTimeout(() => {
      D.junction.classList.remove('on');
      D.vignette.classList.remove('tight');
      D.lanes.classList.remove('bloom');
      if (onDone) onDone(opt);
    }, wait);
  }

  /* ---- the tutorial, once, on the very first junction ------------------ */

  function showTutorial(then) {
    D.tutorial.classList.add('on');
    const dismiss = () => {
      D.tutorial.classList.remove('on');
      G.tutorialSeen = true;
      saveStore();
      D.tutBtn.removeEventListener('click', dismiss);
      then();
    };
    D.tutBtn.addEventListener('click', dismiss);
    D.tutBtn.focus();
  }

  /* ---------------------------------------------------------------------- */

  return {
    /* Input is attached once, in loop.js, and routed by game state — the
       character select uses the same plus and the same gestures. */
    handleCommit: commit,
    handleDrag: onDrag,

    open(q, done) {
      currentQ = q;
      onDone = done;
      build(q);

      D.junction.classList.add('on');
      D.vignette.classList.add('tight');
      Input.preArm();          // hold any answer given during the bloom
      D.hud.classList.remove('dim');

      // announce it for screen readers and for anyone with the sound off
      D.live.textContent = q.prompt + ' Five choices: ' +
        q.options.map((o) => o.dir.toLowerCase() + (q.visualOnly ? '' : ', ' + o.label)).join('; ') + '.';

      // 3. the plaque drops in
      D.prompt.textContent = q.prompt;
      D.prompt.classList.remove('in');
      void D.prompt.offsetWidth;                 // restart the animation
      D.prompt.classList.add('in');

      // 4. the cards bloom outward from centre, 70ms apart
      D.lanes.classList.remove('bloom');
      void D.lanes.offsetWidth;
      D.lanes.classList.add('bloom');

      Audio2.junction();

      const arm = () => Input.arm();
      const bloomTime = G.reduced ? 60 : 640;
      if (!G.tutorialSeen && G.questionIndex === 0) {
        setTimeout(() => showTutorial(arm), bloomTime);
      } else {
        setTimeout(arm, bloomTime);
      }
    },

    /* used by the DEV hooks and verify.js */
    forceAnswer(dir) { if (currentQ) commit(dir); },
    current() { return currentQ; },
  };
})();


/* ========================================================================
   src/screens/claiming.js
   ======================================================================== */
/* ===========================================================================
   claiming.js — the finale (SPEC §C.3)
   ---------------------------------------------------------------------------
   The hero stands in the amphitheatre at dusk, the whole camp gathered in
   silhouette, and then:

     1. three seconds of held silence — fire crackles, everyone looks up.
        RESIST THE URGE TO FILL THIS. The silence is the effect.
     2. light drains to near-black, desaturating from the edges inward
     3. the god-symbol ignites above their head, rotating, casting light down
     4. light bursts outward in a shockwave ring; the crowd kneels in a wave
        rippling from the front row backward
     5. the god's name types out in gold, one letter at a time, bass per letter
     6. a synthesized chorus speaks the claiming line
     7. the result card slides up
   =========================================================================== */

const Claiming = (function () {

  let timers = [];
  const after = (ms, fn) => timers.push(setTimeout(fn, G.reduced ? Math.min(ms, 400) : ms));
  const clearAll = () => { timers.forEach(clearTimeout); timers = []; };

  /* the amphitheatre: tiered stone, a fire, and the camp in silhouette */
  function stage() {
    const sky = uid('cl'), fire = uid('cl');
    let crowd = '';
    // five rows, back to front, so row 0 kneels first in the wave
    for (let row = 0; row < 5; row++) {
      const y = 700 + row * 46;
      const n = 9 + row * 2;
      for (let i = 0; i < n; i++) {
        const x = 800 + ((i - (n - 1) / 2) * (150 - row * 8));
        const s = (0.6 + row * 0.14).toFixed(2);
        crowd += '<g class="cwd" data-row="' + row + '" transform="translate(' + x.toFixed(0) +
          ' ' + y + ') scale(' + s + ')">' +
          '<path d="M0 0 q-22 -10 -22 -46 q0 -30 22 -36 q22 6 22 36 q0 36 -22 46z" fill="#0A0812"/>' +
          '<circle cx="0" cy="-92" r="20" fill="#0E0B16"/></g>';
      }
    }
    let tiers = '';
    for (let i = 0; i < 6; i++) {
      tiers += '<path d="M' + (100 - i * 20) + ' ' + (930 - i * 46) + ' H' + (1500 + i * 20) +
        ' v46 H' + (100 - i * 20) + 'Z" fill="#1A1520" opacity="' + (0.55 + i * 0.07) + '"/>';
    }
    return '<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" ' +
      'xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
      '<defs>' + lg(sky, [[0, '#241A38'], [0.5, '#3E2A46'], [1, '#7A4A38']]) +
        rg(fire, [[0, '#FFE9AE', 0.9], [1, '#FF6B35', 0]], 0.5, 0.5, 0.5) + '</defs>' +
      '<rect width="1600" height="1000" fill="url(#' + sky + ')"/>' +
      // dusk ridge and Thalia's pine on the skyline
      '<path d="M0 470 q220 -70 440 -20 q240 56 460 -30 q260 -100 700 30 v560 H0Z" fill="#1E1628"/>' +
      '<g><path d="M1330 470 v-70 h10 v70Z" fill="#0E0B16"/>' +
      '<path d="M1335 388 l-40 46 h80Z" fill="#141020"/>' +
      '<path d="M1335 358 l-32 40 h64Z" fill="#181428"/></g>' +
      tiers +
      // the fire everyone is standing around
      '<ellipse cx="800" cy="960" rx="300" ry="70" fill="url(#' + fire + ')" class="a-flicker"/>' +
      '<g class="a-flicker" transform="translate(800 960)">' +
        '<path d="M-46 0 q18 -96 44 -120 q-10 58 14 74 q10 -62 26 -82 q22 92 -26 128Z" fill="#FF8A3D"/>' +
        '<path d="M-20 0 q10 -58 26 -74 q0 34 12 42 q0 -32 12 -42 q10 54 -18 74Z" fill="#FFE9AE"/></g>' +
      crowd +
      '</svg>';
  }

  function run() {
    clearAll();
    const res = G.result;
    const god = GODS[res.winner];
    const c = god.colours;

    document.documentElement.style.setProperty('--claim-glow', c[2]);

    D.claimStage.innerHTML = stage();
    // the hero, standing in the middle of it, looking up
    D.claimHero.innerHTML = Rig.still(G.hero, 'awe');
    D.claimSymbol.innerHTML = Sigil[god.symbol] ? Sigil[god.symbol](c[0]) : Sigil.lightning(c[0]);
    D.claimSymbol.classList.remove('ignite');
    D.claimRing.classList.remove('burst');
    D.claimBeam.classList.remove('on');
    D.claimDrain.classList.remove('on');
    D.claimName.innerHTML = '';
    D.claimLine.classList.remove('on');
    D.claimLine.textContent = '';
    D.claiming.classList.add('on');

    D.live.textContent = 'The claiming.';

    // 1. three seconds of held silence
    // 2. light drains to near-black
    after(1600, () => D.claimDrain.classList.add('on'));

    // 3. the symbol ignites and casts its light down
    after(3000, () => {
      D.claimSymbol.classList.add('ignite');
      D.claimBeam.classList.add('on');
      Audio2.divine();
    });

    // 4. the shockwave, and the crowd kneeling in a wave from the front row back
    after(4300, () => {
      D.claimRing.classList.add('burst');
      Particles.shockwave(window.innerWidth / 2, window.innerHeight * 0.23, c[2]);
      Audio2.thunder();
      const rows = D.claimStage.querySelectorAll('.cwd');
      rows.forEach((el) => {
        const row = Number(el.dataset.row);
        setTimeout(() => {
          el.style.transition = 'transform .5s cubic-bezier(.2,.8,.3,1)';
          const t = el.getAttribute('transform');
          el.setAttribute('transform', t + ' translate(0 44) scale(1 0.72)');
        }, G.reduced ? 0 : (4 - row) * 130);
      });
    });

    // 5. the name types out in gold, one bass impact per letter
    after(5100, () => {
      const name = god.name.toUpperCase();
      D.claimName.innerHTML = name.split('').map((ch) =>
        '<span class="ch">' + (ch === ' ' ? '&nbsp;' : ch) + '</span>').join('');
      const chs = D.claimName.querySelectorAll('.ch');
      chs.forEach((el, i) => setTimeout(() => {
        el.classList.add('in');
        Audio2.nameHit(i);
      }, G.reduced ? 0 : i * 130));
    });

    // 6. the chorus speaks the claiming line
    after(6400, () => {
      const epithet = god.epithets[(res.traits.VALOR + res.traits.SHADOW) % god.epithets.length];
      D.claimLine.textContent = 'Hail, child of ' + god.name + ', ' + epithet + '.';
      D.claimLine.classList.add('on');
      Audio2.chorus(god.name.length);
      D.live.textContent = 'Hail, child of ' + god.name + ', ' + epithet + '.';
    });

    // 7. the result card slides up
    after(9200, () => setState(S.RESULT));
  }

  return {
    init() {
      onEnter(S.CLAIMING, run);
      onExit(S.CLAIMING, () => { clearAll(); D.claiming.classList.remove('on'); });
    },
    skip() { clearAll(); setState(S.RESULT); },
  };
})();


/* ========================================================================
   src/screens/result.js
   ======================================================================== */
/* ===========================================================================
   result.js — the Claiming Card
   ---------------------------------------------------------------------------
   A tall, richly illustrated card the player will want to screenshot.

   PNG EXPORT (SPEC §F.4) — this is the known landmine. Rasterising inline SVG
   through drawImage can taint the canvas and make toDataURL() throw a
   SecurityError, and it behaves differently from a file:// origin, which is
   exactly how this game gets opened. So we take the preferred route: the
   downloadable card is drawn from scratch with Canvas 2D primitives, with no
   SVG rasterisation anywhere in the path. If even that fails, we fall back to
   a clean full-bleed "screenshot me" view with the HUD hidden.
   =========================================================================== */

const Result = (function () {

  let hunterResolved = false;

  /* ---- the on-screen card ---------------------------------------------- */

  function renderCard() {
    const res = G.result;
    const god = GODS[res.winner];
    const text = buildResultText(res);
    const item = sacredItemFor(res.winner, G.satchel);
    const hero = HEROES[G.hero];
    const c = god.colours;

    const chip = (svg, label) => '<span class="chip">' + svg + label + '</span>';
    const swatch = '<span class="chip"><span class="swatch" style="background:' + c[0] +
      '"></span>' + god.colourName + '</span>';

    const bars = res.resonance.map((r) => {
      const g2 = GODS[r.god];
      return '<div class="bar-row"><span>' + g2.name + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + r.pct +
        '%;--bar-a:' + g2.colours[0] + ';--bar-b:' + g2.colours[1] + '"></span></span>' +
        '<span>' + r.pct + '%</span></div>';
    }).join('');

    D.card.style.setProperty('--g-a', c[0]);
    D.card.style.setProperty('--g-b', c[1]);
    D.card.style.setProperty('--g-glow', c[2]);

    D.card.className = 'plate';
    D.card.innerHTML =
      '<div class="card-hero">' +
        '<span class="halo"></span>' +
        '<span class="sym">' + (Sigil[god.symbol] || Sigil.lightning)(c[2]) + '</span>' +
        '<span class="fig">' + Rig.still(G.hero, 'awe') + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-god display">' + god.name + '</div>' +
        '<div class="card-dom">' + god.domains + '</div>' +

        '<div class="card-sec"><h4>Your Cabin</h4>' +
          '<p><strong>Cabin ' + god.cabinNumber + '.</strong> ' + god.cabinDescription + '</p></div>' +

        '<div class="card-sec"><h4>Divine Gifts</h4><ul>' +
          text.gifts.map((g) => '<li>' + g + '</li>').join('') + '</ul></div>' +

        '<div class="card-sec"><h4>Your Signature Move</h4><p>' + text.move + '</p></div>' +

        '<div class="card-sec"><h4>Your Sacred Item</h4>' +
          '<div class="chips">' + chip(collectibleArt(item), itemName(item)) + '</div></div>' +

        '<div class="card-sec"><h4>Sacred Marks</h4><div class="chips">' +
          chip(beastArt(god.animal), god.animalName) + swatch +
          chip((Sigil[god.symbol] || Sigil.lightning)(c[0]), god.symbolName) +
        '</div></div>' +

        '<div class="card-sec"><h4>Compatibility</h4><div class="chips">' +
          '<span class="chip" style="border-color:' + GODS[god.ally].colours[0] + '99">Closest ally · ' +
            GODS[god.ally].name + '</span>' +
          '<span class="chip" style="border-color:' + GODS[god.rival].colours[0] + '99">Greatest rival · ' +
            GODS[god.rival].name + '</span>' +
        '</div></div>' +

        '<div class="card-sec"><h4>Resonance</h4><div class="bars">' + bars + '</div></div>' +

        '<div class="card-sec"><h4>Walked as</h4><p>' + hero.name + '</p></div>' +
      '</div>';

    D.resultBtns.innerHTML =
      '<button class="btn" id="btnDownload">Download My Card</button>' +
      '<button class="btn" id="btnCodex2">See All 14 Gods</button>' +
      '<button class="btn" id="btnAgain">Run It Again</button>';
    D.resultBtns.querySelector('#btnDownload').addEventListener('click', downloadCard);
    D.resultBtns.querySelector('#btnCodex2').addEventListener('click', () => Codex.open(S.RESULT));
    D.resultBtns.querySelector('#btnAgain').addEventListener('click', () => {
      resetRun();
      hunterResolved = false;
      setState(S.CHARACTER_SELECT);
    });

    D.cardNote.textContent = '';
    D.live.textContent = 'You are a child of ' + god.name + '. ' + god.domains + '.';
  }

  function itemName(id) {
    return ({
      drachma: 'Golden Drachma', ambrosia: 'Square of Ambrosia', nectar: 'Flask of Nectar',
      riptide: 'A Capped Pen', yankeesCap: 'A Well-Worn Cap', reedPipes: 'Reed Pipes',
      wingedSandal: 'A Winged Sandal', bluePearl: 'A Blue Pearl', bronzeShield: 'Celestial Bronze Shield',
      fleeceTuft: 'A Tuft of the Fleece', owlFeather: 'An Owl Feather', lightningShard: 'A Lightning Shard',
      pomegranateSeed: 'A Pomegranate Seed', laurelCrown: 'A Laurel Crown', lyreString: 'A Lyre String',
      bronzeGear: 'A Bronze Gear', styxVial: 'A Vial of Styx Water', irisPrism: 'An Iris-Message Prism',
      helm: 'A Shard of the Helm',
    })[id] || 'Golden Drachma';
  }

  /* ---- the Hunter's Invitation (Tier 3 easter egg) --------------------- */

  function renderHunter() {
    D.card.className = 'plate';
    D.card.style.setProperty('--g-a', '#C8D4DC');
    D.card.style.setProperty('--g-b', '#1E2A38');
    D.card.style.setProperty('--g-glow', '#EAF4FF');
    D.card.innerHTML =
      '<div class="card-hero">' +
        '<span class="halo"></span>' +
        '<span class="sym">' + circlet() + '</span>' +
        '<span class="fig">' + Rig.still(G.hero, 'awe') + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-god display">The Hunter\'s Invitation</div>' +
        '<div class="card-dom">No god has claimed you. Someone else was watching.</div>' +
        '<div class="card-sec"><p>A girl no older than you steps out of the treeline with a silver ' +
          'circlet in her hand. She does not introduce herself. She does not need to.</p></div>' +
        '<div class="card-sec"><p><em>"You have been going your own way the whole time. ' +
          'You could keep going. With us."</em></p></div>' +
      '</div>';
    D.resultBtns.innerHTML =
      '<button class="btn" id="btnTake">Take the circlet</button>' +
      '<button class="btn" id="btnStay">Stay, and be claimed</button>';
    D.resultBtns.querySelector('#btnTake').addEventListener('click', () => {
      hunterResolved = true;
      D.card.querySelector('.card-body').innerHTML =
        '<div class="card-god display">Hunter of Artemis</div>' +
        '<div class="card-dom">Sworn to the wild things and the long road</div>' +
        '<div class="card-sec"><p>You take it. It is lighter than it looks, and colder, and it fits.</p></div>' +
        '<div class="card-sec"><h4>What you are now</h4><ul>' +
          '<li>You belong to no one but the road</li>' +
          '<li>You see in the dark better than anyone should</li>' +
          '<li>Your aim is quietly, unnervingly perfect</li></ul></div>' +
        '<div class="card-sec"><p class="gilt">This ending happens to about one player in twenty-five.</p></div>';
      D.resultBtns.innerHTML = '<button class="btn" id="btnAgain2">Run It Again</button>';
      D.resultBtns.querySelector('#btnAgain2').addEventListener('click', () => {
        resetRun(); hunterResolved = false; setState(S.CHARACTER_SELECT);
      });
      Audio2.divine();
    });
    D.resultBtns.querySelector('#btnStay').addEventListener('click', () => {
      hunterResolved = true;
      renderCard();
      recordDiscovery();
    });
    D.live.textContent = 'The Hunter\'s Invitation.';
  }

  function circlet() {
    return svgBox(
      '<g class="spin"><circle cx="50" cy="50" r="34" fill="none" stroke="#C8D4DC" stroke-width="3"/>' +
      '<circle cx="50" cy="50" r="42" fill="none" stroke="#EAF4FF" stroke-width="1" ' +
        'stroke-dasharray="2 8"/></g>' +
      '<path d="M50 12 l6 12 l-6 4 l-6 -4z" fill="#EAF4FF"/>' +
      '<path d="M28 24 a30 30 0 0 1 44 0" stroke="#EAF4FF" stroke-width="2" fill="none" opacity=".7"/>');
  }

  function recordDiscovery() {
    if (!G.result) return;
    G.discovered[G.result.winner] = true;
    G.history.unshift({ god: G.result.winner, hero: G.hero, at: Date.now() });
    G.history = G.history.slice(0, 20);
    saveStore();
  }

  /* ---- PNG export, drawn with Canvas 2D primitives only ---------------- */

  function roundRect(x, y, w, h, r) {
    const p = new Path2D();
    p.moveTo(x + r, y);
    p.arcTo(x + w, y, x + w, y + h, r);
    p.arcTo(x + w, y + h, x, y + h, r);
    p.arcTo(x, y + h, x, y, r);
    p.arcTo(x, y, x + w, y, r);
    p.closePath();
    return p;
  }

  function wrap(ctx, text, x, y, maxW, lh) {
    const words = String(text).split(' ');
    let line = '', yy = y;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, x, yy); yy += lh; line = w;
      } else line = test;
    }
    if (line) { ctx.fillText(line, x, yy); yy += lh; }
    return yy;
  }

  function drawCard() {
    const W = 900, H = 1560;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const res = G.result;
    const god = GODS[res.winner];
    const text = buildResultText(res);
    const c = god.colours;
    const DISPLAY = '600 56px Optima, Palatino, Georgia, serif';
    const BODY = '26px "Avenir Next", Avenir, "Segoe UI", Helvetica, sans-serif';

    // background
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, c[1]); bg.addColorStop(0.42, '#17131E'); bg.addColorStop(1, '#0A0810');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // header panel with the god's halo
    const halo = ctx.createRadialGradient(W / 2, 250, 20, W / 2, 250, 420);
    halo.addColorStop(0, c[2]); halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.55; ctx.fillStyle = halo; ctx.fillRect(0, 0, W, 560); ctx.globalAlpha = 1;

    // a simple sigil drawn from primitives — no SVG anywhere in this path
    ctx.save();
    ctx.translate(W / 2, 250);
    ctx.strokeStyle = c[2]; ctx.lineWidth = 5; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(0, 0, 128, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 152, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 9; ctx.lineCap = 'round';
    // an eight-point star, rotated — reads as a divine mark at any size
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * 6.2832;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 40, Math.sin(a) * 40);
      ctx.lineTo(Math.cos(a) * (i % 2 ? 82 : 108), Math.sin(a) * (i % 2 ? 82 : 108));
      ctx.stroke();
    }
    ctx.fillStyle = c[2];
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, 6.2832); ctx.fill();
    ctx.restore();

    // gold hairline frame
    ctx.strokeStyle = 'rgba(227,178,60,.75)'; ctx.lineWidth = 3;
    ctx.stroke(roundRect(18, 18, W - 36, H - 36, 26));

    let y = 500;
    ctx.textAlign = 'center';
    ctx.fillStyle = c[0]; ctx.font = DISPLAY;
    ctx.fillText(god.name, W / 2, y); y += 44;
    ctx.fillStyle = 'rgba(240,228,200,.85)'; ctx.font = '24px "Avenir Next", Helvetica, sans-serif';
    y = wrap(ctx, god.domains, W / 2, y, W - 140, 32) + 24;

    ctx.textAlign = 'left';
    const L = 70, MW = W - 140;
    const heading = (t) => {
      ctx.fillStyle = '#E3B23C';
      ctx.font = '600 22px Optima, Palatino, Georgia, serif';
      ctx.fillText(t.toUpperCase(), L, y); y += 34;
      ctx.fillStyle = '#EFE3CB'; ctx.font = BODY;
    };

    heading('Your Cabin');
    y = wrap(ctx, 'Cabin ' + god.cabinNumber + '. ' + god.cabinDescription, L, y, MW, 36) + 22;

    heading('Divine Gifts');
    for (const g of text.gifts) {
      ctx.fillStyle = '#E3B23C'; ctx.fillText('✦', L, y);
      ctx.fillStyle = '#EFE3CB';
      y = wrap(ctx, g, L + 30, y, MW - 30, 36) + 4;
    }
    y += 18;

    heading('Your Signature Move');
    y = wrap(ctx, text.move, L, y, MW, 36) + 22;

    heading('Your Sacred Item');
    y = wrap(ctx, itemName(sacredItemFor(res.winner, G.satchel)), L, y, MW, 36) + 22;

    heading('Sacred Marks');
    y = wrap(ctx, god.animalName + ' · ' + god.colourName + ' · ' + god.symbolName, L, y, MW, 36) + 22;

    heading('Compatibility');
    y = wrap(ctx, 'Closest ally: ' + GODS[god.ally].name + '.  Greatest rival: ' +
      GODS[god.rival].name + '.', L, y, MW, 36) + 24;

    heading('Resonance');
    for (const r of res.resonance) {
      const g2 = GODS[r.god];
      ctx.fillStyle = '#EFE3CB'; ctx.font = '24px "Avenir Next", Helvetica, sans-serif';
      ctx.fillText(g2.name, L, y + 20);
      const bx = L + 200, bw = MW - 270;
      ctx.fillStyle = 'rgba(255,240,210,.14)';
      ctx.fill(roundRect(bx, y + 4, bw, 18, 9));
      const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      grad.addColorStop(0, g2.colours[1]); grad.addColorStop(1, g2.colours[0]);
      ctx.fillStyle = grad;
      ctx.fill(roundRect(bx, y + 4, Math.max(18, bw * r.pct / 100), 18, 9));
      ctx.fillStyle = '#EFE3CB';
      ctx.fillText(r.pct + '%', bx + bw + 16, y + 20);
      y += 42;
    }

    y = H - 92;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(240,228,200,.6)';
    ctx.font = '22px "Avenir Next", Helvetica, sans-serif';
    ctx.fillText('Walked the road as ' + HEROES[G.hero].name, W / 2, y);
    ctx.fillStyle = 'rgba(227,178,60,.75)';
    ctx.font = '600 22px Optima, Palatino, Georgia, serif';
    ctx.fillText("WHO'S YOUR GODLY PARENT?", W / 2, y + 36);

    return cv;
  }

  function downloadCard() {
    let url = null;
    try {
      const cv = drawCard();
      url = cv.toDataURL('image/png');       // can throw on a tainted canvas
      if (!url || url.length < 2000) throw new Error('empty export');
    } catch (e) {
      // fallback: a clean full-bleed view with the HUD hidden, and a prompt
      // to use the device's own screenshot button
      D.hud.style.display = 'none';
      D.resultBtns.style.display = 'none';
      D.cardNote.textContent =
        'Your browser will not let this page save a file. Take a screenshot of this card instead — ' +
        'the buttons are hidden so it comes out clean. Tap anywhere to bring them back.';
      const restore = () => {
        D.hud.style.display = '';
        D.resultBtns.style.display = '';
        D.cardNote.textContent = '';
        D.result.removeEventListener('click', restore);
      };
      setTimeout(() => D.result.addEventListener('click', restore), 400);
      return;
    }
    try {
      const a = document.createElement('a');
      a.href = url;
      a.download = 'claimed-by-' + GODS[G.result.winner].name.toLowerCase() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      D.cardNote.textContent = 'Saved as a PNG. Check your downloads.';
    } catch (e) {
      // some file:// contexts block the download attribute — open it instead
      try { window.open(url, '_blank'); } catch (e2) {
        D.cardNote.textContent = 'Could not save automatically — take a screenshot of the card instead.';
      }
    }
  }

  return {
    init() {
      onEnter(S.RESULT, () => {
        D.result.classList.add('on');
        D.hud.classList.add('dim');
        if (G.result && G.result.hunter && !hunterResolved) {
          renderHunter();
        } else {
          renderCard();
          recordDiscovery();
        }
        D.result.scrollTop = 0;
      });
      onExit(S.RESULT, () => D.result.classList.remove('on'));
    },
    drawCard,                 // exposed so verify.js can prove the export path runs
  };
})();


/* ========================================================================
   src/screens/codex.js
   ======================================================================== */
/* ===========================================================================
   codex.js — the gallery of all fourteen gods (Tier 2)
   ---------------------------------------------------------------------------
   Undiscovered gods are silhouettes with a locked symbol. Discovered ones
   reveal their art, domains, cabin, sacred animal and symbol.

   This is the replay engine — "13 of 14 found" is what makes a kid go again.
   =========================================================================== */

const Codex = (function () {

  let backTo = S.TITLE;

  function cell(key) {
    const god = GODS[key];
    const found = !!G.discovered[key];
    const c = god.colours;
    return '<div class="codex-cell plate' + (found ? '' : ' locked') + '" tabindex="0" ' +
      'role="button" aria-label="' + (found ? god.name + ', ' + god.domains : 'Undiscovered god') + '" ' +
      'data-key="' + key + '" style="--lane-glow:' + c[0] + '">' +
      '<div class="cs">' + (found ? (Sigil[god.symbol] || Sigil.lightning)(c[0]) : lockedSigil()) + '</div>' +
      '<div class="cn">' + (found ? god.name : '? ? ?') + '</div>' +
      '<div class="cd">' + (found ? 'Cabin ' + god.cabinNumber + ' · ' + god.animalName : 'Not yet claimed') +
      '</div></div>';
  }

  function lockedSigil() {
    return svgBox('<circle cx="50" cy="50" r="40" fill="none" stroke="#6A6258" stroke-width="3" ' +
      'stroke-dasharray="4 7"/>' +
      '<rect x="34" y="46" width="32" height="26" rx="5" fill="#5A5248"/>' +
      '<path d="M40 46 v-8 q0 -10 10 -10 t10 10 v8" stroke="#5A5248" stroke-width="4" fill="none"/>');
  }

  function detail(key) {
    const god = GODS[key];
    if (!G.discovered[key]) return;
    const c = god.colours;
    D.codexDetail.style.setProperty('--g-a', c[0]);
    D.codexDetail.innerHTML =
      '<div class="card-sec"><h4>' + god.name + '</h4>' +
      '<p style="color:' + c[0] + '">' + god.domains + '</p>' +
      '<p style="margin-top:6px"><strong>Cabin ' + god.cabinNumber + '.</strong> ' +
        god.cabinDescription + '</p>' +
      '<div class="chips" style="margin-top:8px">' +
        '<span class="chip">' + beastArt(god.animal) + god.animalName + '</span>' +
        '<span class="chip"><span class="swatch" style="background:' + c[0] + '"></span>' +
          god.colourName + '</span>' +
        '<span class="chip">' + (Sigil[god.symbol] || Sigil.lightning)(c[0]) + god.symbolName + '</span>' +
      '</div></div>';
    D.codexDetail.classList.add('plate');
    D.codexDetail.style.padding = '12px 14px';
    D.live.textContent = god.name + '. ' + god.domains;
  }

  function render() {
    const found = GOD_KEYS.filter((k) => G.discovered[k]).length;
    D.codex.innerHTML =
      '<div style="max-width:960px;margin:0 auto">' +
        '<h2 class="display">The Codex</h2>' +
        '<p id="codexCount" class="gilt">' + found + ' of 14 found</p>' +
        '<div id="codexGrid">' + GOD_KEYS.map(cell).join('') + '</div>' +
        '<div id="codexDetail" style="max-width:520px;margin:0 auto 16px"></div>' +
        '<div class="btn-row"><button class="btn" id="btnCodexBack">Back</button></div>' +
      '</div>';
    D.codexDetail = D.codex.querySelector('#codexDetail');
    D.codex.querySelectorAll('.codex-cell').forEach((el) => {
      const go = () => detail(el.dataset.key);
      el.addEventListener('click', go);
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    });
    D.codex.querySelector('#btnCodexBack').addEventListener('click', () => setState(backTo));
    // open on whatever they were just claimed by
    if (G.result && G.discovered[G.result.winner]) detail(G.result.winner);
  }

  return {
    init() {
      onEnter(S.CODEX, () => { render(); D.codex.classList.add('on'); D.codex.scrollTop = 0; });
      onExit(S.CODEX, () => D.codex.classList.remove('on'));
    },
    open(from) { backTo = from || S.TITLE; setState(S.CODEX); },
  };
})();

/* ---- 2. loading a realm ----------------------------------------------- */

let stripW = [1600, 1600, 1600, 1600];   // rendered width of one copy, per layer
const RATES = [0.02, 0.10, 0.30, 1.60];  // L0, L1, L2, L4 — L3 is the plane

function measureStrip() {
  D.strips.forEach((s, i) => {
    const first = s.querySelector('svg');
    if (!first) return;
    const r = first.getBoundingClientRect();
    if (r.width > 10) stripW[i] = r.width;
  });
}

/* One copy is as wide as the viewport is tall x 16/9, so two copies cover
   every viewport we target and a third is pure cost. Recomputed on resize. */
function copiesNeeded() {
  const copyW = window.innerHeight * (1600 / 900);
  return Math.max(2, Math.ceil(window.innerWidth / copyW) + 1);
}

function fillStrips(art) {
  const layers = [art.L0(), art.L1(), art.L2(), art.L4()];
  const n = copiesNeeded();
  D.strips.forEach((s, i) => { s.innerHTML = layers[i].repeat(n); });
  D.plane.innerHTML = art.L3();
  planeRungs = Array.prototype.slice.call(D.plane.querySelectorAll('.rung'));
  measureStrip();
}

let planeRungs = [];
let horizonY = 0, groundH = 0;

function measurePlane() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.max(vw / 1600, vh / 900);
  const offsetY = (vh - 900 * scale) / 2;
  horizonY = offsetY + PLANE_HORIZON * scale;
  groundH = vh - horizonY;
}

function loadRealm(index) {
  const realm = REALMS[index];
  const art = RealmArt['realm' + realm.id];
  fillStrips(art);

  // realm palette straight into CSS custom properties
  for (const k in realm.cssVars) document.documentElement.style.setProperty(k, realm.cssVars[k]);
  document.documentElement.style.setProperty('--ray-strength', realm.ambient.rays);
  document.documentElement.style.setProperty('--fog-strength', realm.ambient.fog);
  document.documentElement.style.setProperty('--caustic-strength', realm.ambient.caustics || 0);
  D.rays.style.background =
    'repeating-linear-gradient(102deg, rgba(255,255,255,0) 0px, ' +
    hexA(realm.ambient.rayColour, 0.10) + ' 18px, rgba(255,255,255,0) 62px, rgba(255,255,255,0) 120px)';
  D.fog.style.background =
    'radial-gradient(120% 60% at 50% 78%, ' + hexA(realm.ambient.fogColour, 0.75) + ' 0%, transparent 62%)';

  Particles.setRealm(realm.particles);
  D.realmTag.textContent = realm.name;
  spawnItems(realm);
  spawnNPCs(realm);
  Audio2.realmBed(realm.id);
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* ---- 3. collectibles and NPCs ----------------------------------------- */

let items = [];      // { z, lane, id, el, taken }
let npcs = [];       // { z, side, id, el }

function spawnItems(realm) {
  D.items.innerHTML = '';
  items = [];
  const pool = realm.collectibles;
  const n = 4 + Math.floor(Math.random() * 3);         // 4-6 per realm
  for (let i = 0; i < n; i++) {
    // some items sit in one lane only, so replaying to collect a different
    // set is rewarded
    const id = pool[Math.floor(Math.random() * pool.length)];
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute;will-change:transform;pointer-events:none;' +
      'width:64px;height:64px;left:0;top:0';
    el.innerHTML = '<div class="a-bob" style="width:100%;height:100%">' +
      '<div class="a-spinSlow" style="width:100%;height:100%">' + collectibleArt(id) + '</div></div>';
    el.firstChild.style.filter = 'drop-shadow(0 0 10px rgba(255,220,140,.8))';
    D.items.appendChild(el);
    items.push({ z: 1 + i * 0.55 + Math.random() * 0.3, lane: (Math.random() * 2 - 1) * 0.8, id, el, taken: false });
  }
}

function spawnNPCs(realm) {
  D.npcs.innerHTML = '';
  npcs = [];
  realm.npcs.forEach((id, i) => {
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute;will-change:transform;pointer-events:none;' +
      'width:260px;height:260px;left:0;top:0';
    el.innerHTML = beastArt(id);
    D.npcs.appendChild(el);
    npcs.push({ z: 0.75 + i * 0.85, side: i % 2 ? 1 : -1, id, el, reacted: false });
  });
}

/* project a point on the path into screen space */
function project(z, lane) {
  const u = Math.max(0, Math.min(1, 1 - z));
  const p = Math.pow(u, 2.2);
  return {
    y: horizonY + groundH * p,
    x: window.innerWidth / 2 + lane * p * window.innerWidth * 0.42,
    s: 0.10 + p * 1.5,
  };
}

function stepItems(dt, speed) {
  const dz = (speed / 900) * dt;
  for (const it of items) {
    if (it.taken) continue;
    it.z -= dz;
    if (it.z < 0.04) {
      // collected automatically on pass-through
      it.taken = true;
      it.el.style.display = 'none';
      G.satchel.push(it.id);
      addSatchelIcon(it.id);
      const p = project(0.06, it.lane);
      Particles.burst(p.x, p.y, '#FFE9AE', 22, 1.2);
      Audio2.collect();
      continue;
    }
    if (it.z > 1.05) { it.el.style.opacity = 0; continue; }
    const p = project(it.z, it.lane);
    it.el.style.opacity = Math.min(1, (1.05 - it.z) * 6);
    it.el.style.transform = 'translate3d(' + (p.x - 32) + 'px,' + (p.y - 60 * p.s) + 'px,0) scale(' +
      p.s.toFixed(3) + ')';
  }
}

function stepNPCs(dt, speed) {
  const dz = (speed / 1400) * dt;                 // NPCs drift by more slowly
  for (const n of npcs) {
    n.z -= dz;
    if (n.z < -0.25) { n.z = 1.5 + Math.random() * 0.9; n.side = Math.random() < 0.5 ? -1 : 1; n.reacted = false; }
    const p = project(Math.max(0, n.z), n.side * (1.55 + n.z * 0.45));
    n.el.style.opacity = Math.min(0.95, Math.max(0, (1.15 - n.z) * 2.2));
    // cap the scale: unclamped, a creature that walks right past the camera
    // fills half the screen and reads as an unidentifiable shape
    const ns = Math.min(p.s * 0.95, 0.72);
    n.el.style.transform = 'translate3d(' + (p.x - 130) + 'px,' + (p.y - 232 * ns) + 'px,0) scale(' +
      ns.toFixed(3) + ')';
    // they react as you draw level with them
    if (!n.reacted && n.z < 0.35) {
      n.reacted = true;
      n.el.firstChild.style.transition = 'transform .5s ease-out';
      n.el.firstChild.style.transform = 'scale(1.09) rotate(' + (-n.side * 5) + 'deg)';
    }
  }
}

function addSatchelIcon(id) {
  const el = document.createElement('div');
  el.className = 'satchel-item';
  el.innerHTML = collectibleArt(id);
  el.title = id;
  D.satchel.appendChild(el);
}

/* ---- 4. the ground plane rushing toward the camera --------------------- */

let planeT = 0;
function stepPlane(dt, speed) {
  planeT = (planeT + (speed / 900) * dt * 0.55) % 1;
  const n = planeRungs.length;
  for (let i = 0; i < n; i++) {
    const u = ((i / n) + planeT) % 1;
    const p = Math.pow(u, 2.2);
    const y = PLANE_HORIZON + (900 - PLANE_HORIZON) * p;
    const halfW = 34 + p * 490;
    const h = 3 + p * 16;
    planeRungs[i].setAttribute('d',
      'M' + (800 - halfW) + ' ' + y + ' H' + (800 + halfW) + ' v' + h + ' H' + (800 - halfW) + 'Z');
    planeRungs[i].setAttribute('opacity', (0.05 + p * 0.22).toFixed(3));
  }
}

/* ---- 5. realm intro, exit transitions ---------------------------------- */

function showRealmIntro(then) {
  const realm = currentRealm();
  D.realmIntro.querySelector('.ri-name').textContent = realm.name;
  D.realmIntro.querySelector('.ri-sub').textContent = realm.subtitle;
  D.realmIntro.classList.add('on');
  D.live.textContent = realm.name + '. ' + realm.subtitle;
  setTimeout(() => { D.realmIntro.classList.remove('on'); then(); }, G.reduced ? 900 : 2500);
}

/* Each exit is a distinct full-screen flourish, never a fade. */
const Transitions = {
  trunkDive(done) {
    D.transition.innerHTML =
      '<div class="tr-trunk tr-left"></div><div class="tr-trunk tr-right"></div>';
    D.transition.className = 'fxlayer tr-on';
    Audio2.whoosh();
    setTimeout(done, 760);
  },
  waveCrash(done) {
    D.transition.innerHTML = '<div class="tr-wave"></div><div class="tr-foam"></div>';
    D.transition.className = 'fxlayer tr-on';
    Audio2.whoosh();
    setTimeout(done, 900);
  },
  whirlpool(done) {
    D.transition.innerHTML = '<div class="tr-spiral"></div><div class="tr-lantern"></div>';
    D.transition.className = 'fxlayer tr-on';
    Audio2.whoosh();
    setTimeout(done, 1050);
  },
  lightningWhite(done) {
    // suppressed entirely under reduced motion — this is the flash rule
    if (G.reduced) { setTimeout(done, 260); return; }
    Audio2.thunder();
    D.flash.classList.add('on');
    setTimeout(() => D.flash.classList.remove('on'), 200);
    setTimeout(done, 620);
  },
  skyDescent(done) {
    D.transition.innerHTML = '<div class="tr-cloud"></div>';
    D.transition.className = 'fxlayer tr-on';
    D.stage.classList.add('tr-spin');
    Audio2.whoosh();
    setTimeout(() => D.stage.classList.remove('tr-spin'), 1200);
    setTimeout(done, 1250);
  },
};

function runTransition(name, done) {
  const fn = Transitions[name] || Transitions.trunkDive;
  if (G.reduced && name !== 'lightningWhite') {
    D.transition.className = 'fxlayer';
    setTimeout(done, 240);
    return;
  }
  fn(() => { D.transition.className = 'fxlayer'; D.transition.innerHTML = ''; done(); });
}

/* ---- 6. the flow ------------------------------------------------------- */

function updateDots() {
  const dots = D.dots.children;
  for (let i = 0; i < dots.length; i++) {
    dots[i].className = i < G.questionIndex ? 'done' : (i === G.questionIndex ? 'now' : '');
  }
}

function beginRunSegment() {
  G.runTime = 0;
  G.segmentLength = 4 + Math.random() * 3;          // 4-7 seconds
  G.targetSpeed = currentRealm().runSpeed;
  G.timeScale = 1;
  Rig.setState('run');
  D.hud.classList.add('dim');
  setState(S.RUNNING);
}

function openJunction() {
  if (G.questionIndex >= QUESTIONS.length) {
    G.result = scoreRun(G.answers, QUESTIONS);
    setState(S.CLAIMING);
    return;
  }
  setState(S.JUNCTION);
  updateDots();
  Junction.open(currentQuestion(), () => {
    setState(S.RESOLVING);
    G.questionIndex++;
    updateDots();
    // three junctions per realm
    if (G.questionIndex % 3 !== 0) {
      beginRunSegment();
      return;
    }
    setState(S.REALM_EXIT);
    const exit = currentRealm().transitionOut;
    runTransition(exit, () => {
      if (G.questionIndex >= QUESTIONS.length) {
        G.result = scoreRun(G.answers, QUESTIONS);
        setState(S.CLAIMING);
        return;
      }
      G.realmIndex++;
      loadRealm(G.realmIndex);
      setState(S.REALM_INTRO);
    });
  });
}

/* ---- 7. HUD ------------------------------------------------------------ */

function paintToggles() {
  D.togSound.innerHTML = G.muted ? Glyph.soundOff() : Glyph.soundOn();
  D.togSound.setAttribute('aria-pressed', String(!G.muted));
  D.togSound.setAttribute('aria-label', G.muted ? 'Sound off. Turn sound on' : 'Sound on. Turn sound off');
  D.togMotion.innerHTML = G.reduced ? Glyph.motionOff() : Glyph.motion();
  D.togMotion.setAttribute('aria-pressed', String(G.reduced));
  D.togMotion.setAttribute('aria-label', G.reduced ? 'Reduced motion on' : 'Reduced motion off');
}

function initHUD() {
  paintToggles();
  D.togSound.addEventListener('click', () => {
    G.muted = !G.muted;
    Audio2.unlock();
    Audio2.setMuted(G.muted);
    if (!G.muted) Audio2.realmBed(currentRealm().id);
    paintToggles();
    saveStore();
  });
  D.togMotion.addEventListener('click', () => {
    G.reduced = !G.reduced;
    applyReduced();
    paintToggles();
    saveStore();
  });
}

/* ---- 8. the frame ------------------------------------------------------ */

let last = 0, frameCount = 0, slowFrames = 0;
let fpsAcc = 0, fpsN = 0, fps = 60;
const frameTimes = [];

function frame(now) {
  requestAnimationFrame(frame);
  if (!last) { last = now; return; }
  let dtReal = (now - last) / 1000;
  last = now;
  if (dtReal > 0.1) dtReal = 0.1;                 // a tab that was backgrounded
  const t = now / 1000;

  // frame timing, for the p95 report and the auto-downgrade
  frameTimes.push(dtReal * 1000);
  if (frameTimes.length > 600) frameTimes.shift();
  fpsAcc += dtReal; fpsN++;
  if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  if (dtReal * 1000 > 22) slowFrames++; else slowFrames = 0;
  if (slowFrames > 30 && G.quality === 1) {
    G.quality = 0.5;
    Particles.setQuality(0.5);
    document.documentElement.style.setProperty('--dof', '0');
    if (DEV) console.warn('quality auto-downgraded');
  }

  const dt = dtReal * G.timeScale;
  lerpTint(dtReal);

  if (G.state === S.RUNNING) {
    G.runTime += dt;
    // slow to about 35% as the junction comes up — this moment is the feel
    const left = G.segmentLength - G.runTime;
    if (left < 0.7) G.timeScale = Math.max(0.35, 0.35 + (left / 0.7) * 0.65);
    if (G.runTime >= G.segmentLength) { G.timeScale = 1; openJunction(); }
  }

  // speed eases toward its target rather than snapping
  const wantSpeed = (G.state === S.RUNNING) ? G.targetSpeed : 0;
  G.speed += (wantSpeed - G.speed) * Math.min(1, dtReal * 2.2);

  if (G.speed > 1) {
    G.scroll += G.speed * dt;
    if (!G.reduced) {
      for (let i = 0; i < D.strips.length; i++) {
        const off = -((G.scroll * RATES[i]) % stripW[i]);
        D.strips[i].style.transform = 'translate3d(' + off.toFixed(1) + 'px,0,0)';
      }
    }
    stepPlane(dt, G.speed);
    stepItems(dt, G.speed);
    stepNPCs(dt, G.speed);
  }

  Rig.update(dt, t, G.speed);
  Particles.frame(dtReal, t);

  if (DEV && (frameCount++ % 10 === 0)) paintDev();
}

function paintDev() {
  const r = G.answers.length ? scoreRun(G.answers, QUESTIONS) : null;
  D.dev.textContent =
    'state ' + G.state + '   q' + (G.questionIndex + 1) + '/15   fps ' + fps.toFixed(0) +
    '   parts ' + Particles.count() +
    '\nspeed ' + G.speed.toFixed(0) + '  ts ' + G.timeScale.toFixed(2) +
    '  quality ' + G.quality +
    (r ? '\nleading: ' + r.ranking.slice(0, 4).map((k) => GODS[k].name + ' ' +
      (r.scores[k] * 100).toFixed(0)).join('  ') : '');
}

function p95() {
  if (!frameTimes.length) return 0;
  const s = frameTimes.slice().sort((a, b) => a - b);
  return s[Math.floor(s.length * 0.95)];
}

/* ---- 9. boot ----------------------------------------------------------- */

function boot() {
  buildDOM();
  loadStore();
  initReducedMotion();
  Particles.init(D.fx);
  measurePlane();
  window.addEventListener('resize', () => { measurePlane(); measureStrip(); });
  window.addEventListener('orientationchange', () => setTimeout(() => {
    measurePlane(); measureStrip();
  }, 200));

  // input is attached once and routed by state, so the character select
  // teaches exactly the gestures the junctions will ask for
  Input.attach(D.stage, {
    onCommit(dir) {
      if (G.state === S.CHARACTER_SELECT) Select.handleCommit(dir);
      else if (G.state === S.JUNCTION) Junction.handleCommit(dir);
    },
    onDrag(dir, strength, dx, dy) {
      if (G.state === S.CHARACTER_SELECT) Select.handleDrag(dir, strength, dx, dy);
      else if (G.state === S.JUNCTION) Junction.handleDrag(dir, strength, dx, dy);
    },
  });

  TitleScreen.init();
  Select.init();
  Claiming.init();
  Result.init();
  Codex.init();
  initHUD();

  onEnter(S.REALM_INTRO, () => {
    D.hud.classList.remove('hidden');
    Rig.mount(D.hero, G.hero);
    showRealmIntro(beginRunSegment);
  });
  [S.TITLE, S.CHARACTER_SELECT, S.RESULT, S.CODEX, S.CLAIMING].forEach((st) => {
    onEnter(st, () => {
      D.hud.classList.add('hidden');
      document.documentElement.classList.add('overlay-open');
    });
    onExit(st, () => document.documentElement.classList.remove('overlay-open'));
  });
  onEnter(S.CLAIMING, () => { G.speed = 0; G.timeScale = 1; });

  // realm 1 is loaded up front so the title screen has a living world behind it
  loadRealm(0);
  Rig.mount(D.hero, G.hero);
  updateDots();

  if (DEV) D.dev.classList.add('on');
  requestAnimationFrame(frame);
  setState(S.TITLE);
}

/* -------------------------------------------------------------------------
   Hooks for verify.js. These are read-only levers into the flow; they carry
   no UI of their own, so they are safe to leave in the shipped file.
   ------------------------------------------------------------------------- */
window.__game = {
  get state() { return G.state; },
  get p95() { return p95(); },
  get fps() { return fps; },
  G, D, S,
  setState,
  loadRealm,
  answer(dir) { if (G.state === S.JUNCTION) Junction.handleCommit(dir); },
  /* jump straight to a question, filling in random answers on the way */
  jumpTo(qIndex) {
    if (qIndex < G.questionIndex) { G.answers = []; G.questionIndex = 0; G.result = null; }
    while (G.questionIndex < qIndex) {
      const q = QUESTIONS[G.questionIndex];
      const opt = q.options[G.questionIndex % 5];
      G.answers.push({ q, opt });
      G.questionIndex++;
    }
    G.realmIndex = Math.min(4, Math.floor(G.questionIndex / 3));
    loadRealm(G.realmIndex);
    updateDots();
  },
  forceGod(key) {
    // build an answer set that actually maximises this god, so the claiming
    // and the card render exactly as a real playthrough would
    G.answers = QUESTIONS.map((q) => {
      let best = q.options[0], bestN = -1;
      q.options.forEach((o) => { const n = (o.gods || {})[key] || 0; if (n > bestN) { bestN = n; best = o; } });
      return { q, opt: best };
    });
    G.questionIndex = 15;
    G.result = scoreRun(G.answers, QUESTIONS);
    return G.result.winner;
  },
  openJunctionNow() { if (G.state === S.RUNNING) { G.runTime = G.segmentLength; } },
  skipTutorial() { G.tutorialSeen = true; saveStore(); },
  result() { return G.result; },
  validate() { return validateAnswerKey(QUESTIONS); },
  drawCard() { return Result.drawCard(); },
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
